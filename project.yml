name: PersonalAssistant
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
packages:
  AssistantCore:
    path: .
  MLXLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.32.3
  MLX:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.32.3
  HuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    exactVersion: 0.9.0
  Transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.0
targets:
  PersonalAssistant:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jacob.personalassistant
        PRODUCT_NAME: PersonalAssistant
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: AssistantCore
        product: AssistantCore
      - package: MLXLM
        product: MLXLLM
      - package: MLXLM
        product: MLXVLM
      - package: MLXLM
        product: MLXLMCommon
      - package: MLXLM
        product: MLXHuggingFace
      - package: MLX
        product: MLX
      - package: HuggingFace
        product: HuggingFace
      - package: Transformers
        product: Tokenizers
schemes:
  PersonalAssistant:
    build:
      targets:
        PersonalAssistant: all
    run:
      config: Debug
    archive:
      config: Release
