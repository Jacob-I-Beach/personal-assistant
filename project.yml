name: PersonalAssistant
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
packages:
  Textual:
    url: https://github.com/gonzalezreal/textual
    exactVersion: 0.5.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.20
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
  JOSESwift:
    url: https://github.com/airsidemobile/JOSESwift
    exactVersion: 3.0.0
  AssistantCore:
    path: .
  MLXLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.32.3
  MLX:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.32.3
  HuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    exactVersion: 0.9.0
  Transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.0
targets:
  PersonalAssistant:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist, "*.entitlements"]
      - path: Shared/AssistantActivityAttributes.swift
      - path: Shared/AssistantActivityViews.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jacob.personalassistant
        PRODUCT_NAME: PersonalAssistant
        INFOPLIST_FILE: App/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: App/Support/Assistant-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: NO
        ASSISTANT_PUSH_ENVIRONMENT: disabled
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: App/PersonalAssistant.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "15"
    dependencies:
      - package: Textual
        product: Textual
      - package: ZIPFoundation
        product: ZIPFoundation
      - target: PersonalAssistantWatch
        embed: true
      - target: AssistantActivityWidget
        embed: true
      - package: MarkdownUI
        product: MarkdownUI
      - package: JOSESwift
        product: JOSESwift
      - package: AssistantCore
        product: AssistantCore
      - package: MLXLM
        product: MLXLLM
      - package: MLXLM
        product: MLXVLM
      - package: MLXLM
        product: MLXLMCommon
      - package: MLXLM
        product: MLXHuggingFace
      - package: MLX
        product: MLX
      - package: HuggingFace
        product: HuggingFace
      - package: Transformers
        product: Tokenizers
  AssistantActivityWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ActivityWidget
        excludes: [Info.plist]
      - path: Shared/AssistantActivityAttributes.swift
      - path: Shared/AssistantActivityViews.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jacob.personalassistant.activity
        INFOPLIST_FILE: ActivityWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSISTANT_PUSH_ENVIRONMENT: disabled
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "15"
  PersonalAssistantWatch:
    type: application
    platform: watchOS
    deploymentTarget: "27.0"
    sources:
      - path: WatchApp
        excludes: [Info.plist]
      - path: Sources/AssistantCore/WatchMessages.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jacob.personalassistant.watchkitapp
        PRODUCT_NAME: PersonalAssistantWatch
        INFOPLIST_FILE: WatchApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "15"
  PersonalAssistantUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jacob.personalassistant.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: PersonalAssistant
  PersonalAssistantPlatformTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PlatformTests, Tests/PlanningEventKitBridgeTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jacob.personalassistant.platformtests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: Textual
        product: Textual
      - target: PersonalAssistant
      - package: AssistantCore
        product: AssistantCore
      - package: JOSESwift
        product: JOSESwift
schemes:
  PersonalAssistant:
    build:
      targets:
        PersonalAssistant: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [PersonalAssistantPlatformTests, PersonalAssistantUITests]
      language: en
      region: US
      preferredScreenCaptureFormat: screenshots
    archive:
      config: Release
