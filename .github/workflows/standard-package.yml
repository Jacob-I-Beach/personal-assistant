name: Prepare standard iPhone signing input
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful device archive run to reuse
        required: true
        default: '38304430671'
      source_sha256:
        description: Expected iPhone-only archive checksum
        required: true
        default: '7bf76d18bf8608af4c41a24dfea5e3b69f923a7ade5da14d2180a9291529ca48'
permissions:
  contents: read
  actions: read
jobs:
  standard-package:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-iphone-app
          path: .build/input
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - name: Verify exact input and remove Health signing requirements
        env:
          EXPECTED_SHA256: ${{ inputs.source_sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          actual=$(shasum -a 256 .build/input/PersonalAssistant-iPhone-only.ipa | cut -d ' ' -f 1)
          test "$actual" = "$EXPECTED_SHA256"
          python3 scripts/prepare_standard_package.py .build/input/PersonalAssistant-iPhone-only.ipa .build/input/SHA256SUMS.txt .build/standard/PersonalAssistant-Standard.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: standard-iphone-app
          path: .build/standard/*
          retention-days: 1
