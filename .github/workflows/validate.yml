name: Validate native app
on:
  workflow_dispatch:
    inputs:
      validate_simulator:
        description: Compile and smoke-test the app in the iPhone simulator
        type: boolean
        default: true
      build_device:
        description: Also produce an unsigned physical-iPhone package for local signing
        type: boolean
        default: false
      validation_scope:
        description: Full suite, export repair, or interaction regressions after an inspected full-suite run
        type: choice
        options: [full, export-repair, interaction-repair]
        default: full
permissions:
  contents: read
jobs:
  ios:
    # Standard Apple silicon preview image that actually includes the iOS 27 SDK.
    runs-on: xcode-27
    timeout-minutes: ${{ inputs.validation_scope == 'export-repair' && 15 || 20 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Select Xcode 27
        run: |
          selected=$(find /Applications -maxdepth 1 -name 'Xcode_27*.app' -print | sort | head -n 1)
          if [ -z "$selected" ]; then
            echo "This runner does not have Xcode 27. Select a compatible Apple silicon runner image."
            exit 1
          fi
          sudo xcode-select --switch "$selected/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: Install Apple's Metal compiler
        run: |
          xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version
      - name: Test the shared core with a local transport fixture
        id: core
        continue-on-error: true
        run: |
          mkdir -p .build
          python --version
          python scripts/mock_model_server.py --port-file .build/fixture-port.txt > .build/fixture.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 300); do
            if [ -s .build/fixture-port.txt ]; then break; fi
            if ! kill -0 "$fixture_pid" 2>/dev/null; then
              cat .build/fixture.log
              exit 1
            fi
            sleep 0.1
          done
          if [ ! -s .build/fixture-port.txt ]; then
            cat .build/fixture.log
            echo 'The local test server did not become ready within 30 seconds.'
            exit 1
          fi
          export ASSISTANT_FIXTURE_BASE_URL="http://127.0.0.1:$(cat .build/fixture-port.txt)"
          set -o pipefail
          swift test 2>&1 | tee .build/core-tests.log
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml
          mkdir -p PersonalAssistant.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Dependencies/Package.resolved PersonalAssistant.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Build and exercise the native app in Simulator
        if: inputs.validate_simulator
        run: |
          xcrun simctl list devices available --json > .build/simulators.json
          simulator_id=$(python scripts/select_simulator.py .build/simulators.json)
          trap 'xcrun simctl shutdown "$simulator_id" || true' EXIT
          xcrun simctl bootstatus "$simulator_id" -b
          set -o pipefail
          test_options=()
          if [ "${{ inputs.validation_scope }}" = "export-repair" ]; then
            test_options+=("-only-testing:PersonalAssistantPlatformTests" "-only-testing:PersonalAssistantUITests/AssistantUITests/testConnectedFolderAndFilesOutputs")
          elif [ "${{ inputs.validation_scope }}" = "interaction-repair" ]; then
            test_options+=("-only-testing:PersonalAssistantPlatformTests")
            for scenario in testAttachmentPreviewWorkingSurfacesAndActualMessageEdit testDarkAndLargeTextControlsRemainUsable testForegroundReturnContinuesWithoutAnotherUserMessage testHomeActionsOpenRealWorkflowsAndKeepTheUsersWords testKeyboardAndDisclosurePreserveReadingPosition testRichConversationArtifactAndHistory testSavedRouteMemoryUndoAndResumeStayInTheApp testStreamingFollowsDetachesAndReturnsToFollowing; do
              test_options+=("-only-testing:PersonalAssistantUITests/AssistantUITests/$scenario")
            done
          fi
          xcodebuild -project PersonalAssistant.xcodeproj -scheme PersonalAssistant -configuration Debug -destination "platform=iOS Simulator,id=$simulator_id" -derivedDataPath DerivedData -resultBundlePath .build/UITests.xcresult -skipMacroValidation -parallel-testing-enabled NO -collect-test-diagnostics never -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 "${test_options[@]}" CODE_SIGNING_ALLOWED=NO test 2>&1 | tee .build/ui-tests.log
      - name: Export native screenshots
        if: always()
        run: |
          if [ -d .build/UITests.xcresult ]; then
            xcrun xcresulttool export attachments --path .build/UITests.xcresult --output-path .build/ui-attachments
          fi
      - name: Build an unsigned physical-iPhone package
        if: inputs.build_device
        run: |
          set -o pipefail
          xcodebuild -project PersonalAssistant.xcodeproj -scheme PersonalAssistant -configuration Release -destination 'generic/platform=iOS' -derivedDataPath DerivedData -skipMacroValidation CODE_SIGNING_ALLOWED=NO build 2>&1 | tee .build/device-build.log
          # An ad-hoc seal carries requested capabilities into a signing tool; it is not installable Apple signing.
          app_path="DerivedData/Build/Products/Release-iphoneos/PersonalAssistant.app"
          if [ -d "$app_path/Watch/PersonalAssistantWatch.app" ]; then
            codesign --force --sign - "$app_path/Watch/PersonalAssistantWatch.app"
          fi
          codesign --force --sign - --entitlements App/PersonalAssistant.entitlements "$app_path"
          mkdir -p .build/device/Payload
          ditto DerivedData/Build/Products/Release-iphoneos/PersonalAssistant.app .build/device/Payload/PersonalAssistant.app
          (cd .build/device && zip -qr PersonalAssistant-unsigned.ipa Payload)
          python scripts/prepare_iloader_package.py .build/device/PersonalAssistant-unsigned.ipa .build/device/PersonalAssistant-iPhone-only.ipa
          (cd .build/device && shasum -a 256 *.ipa > SHA256SUMS.txt)
          python scripts/inspect_ipa.py .build/device/PersonalAssistant-unsigned.ipa .build/device/SHA256SUMS.txt --report .build/device/CompletePackageValidation.json
          python scripts/inspect_ipa.py .build/device/PersonalAssistant-iPhone-only.ipa .build/device/SHA256SUMS.txt --report .build/device/iPhonePackageValidation.json
      - name: Preserve unsigned device package
        if: inputs.build_device && success()
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-iphone-app
          path: |
            .build/device/PersonalAssistant-unsigned.ipa
            .build/device/PersonalAssistant-iPhone-only.ipa
            .build/device/PersonalAssistant-iPhone-only.json
            .build/device/*PackageValidation.json
            .build/device/SHA256SUMS.txt
          include-hidden-files: true
          retention-days: 1
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          include-hidden-files: true
          path: |
            .build/ios-build.log
            .build/core-tests.log
            .build/fixture.log
            .build/ui-tests.log
            .build/ui-attachments
            .build/device-build.log
            PersonalAssistant.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: ignore
          retention-days: 7
      - name: Require successful shared-core tests
        if: always() && steps.core.outcome != 'success'
        run: exit 1
